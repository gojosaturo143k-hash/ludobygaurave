<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Welcome to Ludo</title>
    <link rel="icon" href="ludoFacIcon.png" type="image/png">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">

    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>

<!-- Onboarding modal (Phase 6) -->
<div id="onboardingModal" class="onboard-modal" style="display:none;">
  <div class="onboard-content">
    <h1>Welcome to Ludo</h1>
    <p>Enter your player name to continue</p>
    <input id="onboardName" type="text" class="form-control" maxlength="20" placeholder="Your name">
    <div id="onboardError" class="text-danger small mt-2" style="display:none;"></div>
    <div class="mt-3 d-flex justify-content-center">
      <button id="onboardSave" class="btn btn-primary me-2">Save & Continue</button>
    </div>
  </div>
</div>

<div class="menuContainer">
    <div class="container my-auto">
        <div class="row">
            <div class="col-sm-8 col-md-6 col-lg-5 col-xl-4 startMenu mx-auto text-center">

                <div class="menu">
                    <h1 class="my-3"><b>LUDO</b></h1>
                    <img class="dice" src="diceFront.png" alt="">

                    <h3 class="my-3 font-monospace">Join Multiplayer</h3>

                    <!-- 🔥 NEW: PLAYER NAME -->
                    <input type="text"
                           id="playerName"
                           class="form-control my-2"
                           placeholder="Your name">

                    <!-- small player info + change name (Phase 6) -->
                    <div id="playerInfo" class="small text-light mt-1" style="display:none;">
                      Playing as: <span id="playerInfoName"></span>
                      <button id="changeNameBtn" class="btn btn-link btn-sm text-decoration-none">Change</button>
                    </div>

                    <!-- 🔥 NEW: ROOM CODE -->
                    <input type="text"
                           id="roomCode"
                           class="form-control my-2"
                           placeholder="Room code">

                    <!-- OPTIONAL PLAYER COLOR UI (unchanged) -->
                    <div class="choosePlayers mt-3">
                        <div class="redPlayer players" id="redPlayer"><img src="red token.png"></div>
                        <div class="greenPlayer players" id="greenPlayer"><img src="green token.png"></div>
                        <div class="yellowPlayer players" id="yellowPlayer"><img src="yellow token.png"></div>
                        <div class="bluePlayer players" id="bluePlayer"><img src="blue token.png"></div>
                    </div>

                    <div class="start">
                        <a href="#" class="btn btn-light my-3" id="play"><b>Play</b></a>
                        <a href="#" class="btn btn-success my-3" id="createRoom"><b>Create Room</b></a>
                        <a href="#" class="btn btn-primary my-3" id="joinRoom"><b>Join Room</b></a>
                    </div>

                    <!-- STATUS -->
                    <div id="status" class="text-light mt-2"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 🔥 WEBSOCKET CONNECTION -->
<script>
    const ws = new WebSocket("wss://ludobygaurave-pen5.onrender.com");

    ws.onopen = () => {
        document.getElementById("status").innerText = "Connected to server ✅";
    };

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        console.log("Server:", data);
    };

    ws.onerror = () => {
        document.getElementById("status").innerText = "Server connection failed ❌";
    };
</script>

<!-- Firebase compat SDKs (fixed version 9.22.1) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<!-- Firebase config & init (Phase 1: Anonymous Auth only) -->
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>

<!-- Firebase room module (Phase 2) -->
<script src="js/firebase-room.js"></script>

<!-- Onboarding script (Phase 6) -->
<script src="js/onboarding.js"></script>

<!-- EXISTING JS -->
<script src="index.js"></script>

</body>

</html>
